[project]
name = "ex_one"
version = "0.1.0"
description = "ex_one using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.9.3",
    "litellm>=1.75.3",
    "python-dotenv>=1.1.1",
]

[project.scripts]
ex_one = "ex_one.main:run"
run_crew = "ex_one.main:run"
train = "ex_one.main:train"
replay = "ex_one.main:replay"
test = "ex_one.main:test"
run_with_trigger = "ex_one.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
